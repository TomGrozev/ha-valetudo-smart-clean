[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Let Home Assistant install its httpx alias before respx is imported.
addopts = -p no:respx
testpaths = tests
# Root on sys.path so tests can import custom_components.valetudo_smart_clean and
# so the Home Assistant loader discovers the custom integration.
pythonpath = .
norecursedirs = .git .venv custom_components docs
